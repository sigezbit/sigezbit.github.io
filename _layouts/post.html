---
layout: default
---

<article>
  {% assign intro = site[page.lang] | where: "topic_slug", page.topic_slug | where: "layout", "landing" | first %}
  
  {% include topic-navigation.html %}

  <hr><br>

  
  <h1>{{ page.title }}</h1>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>
  
  <hr>

  {% include topic-navigation.html %}
</article>


<p>
  <small>
    <a href="{{ intro.url | relative_url }}">{{ site.data.topics[page.topic_slug][page.lang] }}</a>
  </small>
</p>
